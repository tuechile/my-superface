[project]
name = "my-superface"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["superface"]
