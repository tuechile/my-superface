<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-superface</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .5rem 0; }
  canvas { display: block; width: 100%; max-width: 512px; margin-top: 1rem; image-rendering: pixelated; }
  details { margin: .5rem 0; font-size: .8rem; color: #888; }
  summary { cursor: pointer; }
</style>
</head>
<body>
<h1>my-superface</h1>
<form id="form">
  <label>Source <input type="file" name="source" accept="image/*" required></label>
  <label>Size <input type="number" name="size" value="128" min="8" max="256"></label>
  <label>Spatial weight <input type="number" name="spatial" value="2" step="0.5" min="0"></label>
  <details>
    <summary>change face</summary>
    <input type="file" name="target" accept="image/*">
  </details>
  <button>Transform</button>
  <button type="button" id="replay" disabled>Replay</button>
  <button type="button" id="download" disabled>Download</button>
  <span id="status"></span>
</form>
<canvas id="canvas" hidden></canvas>
<script src="superface.js"></script>
<script>
  const form = document.getElementById("form");
  const fields = form.elements;
  const status = document.getElementById("status");
  const canvas = document.getElementById("canvas");
  const replay = document.getElementById("replay");
  const download = document.getElementById("download");
  let result;

  form.onsubmit = async (e) => {
    e.preventDefault();
    const size = Math.min(256, Math.max(8, Number(fields.size.value)));
    status.textContent = "working...";
    await new Promise((r) => setTimeout(r, 0));
    const src = await loadPixels(fields.source.files[0], size);
    const tgt = await loadPixels(fields.target.files[0] || (await (await fetch("face.jpg")).blob()), size);
    const { owner, swaps } = assign(src, tgt, size, Number(fields.spatial.value));
    result = { palette: colors(src), owner, swaps, size };
    status.textContent = "";
    canvas.hidden = false;
    replay.disabled = download.disabled = false;
    play(canvas, result.palette, swaps, size);
  };

  replay.onclick = () => play(canvas, result.palette, result.swaps, result.size);

  download.onclick = () => {
    drawFrame(canvas, result.palette, result.owner, result.size);
    const a = document.createElement("a");
    a.download = "superface.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
</script>
</body>
</html>
